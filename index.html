<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a17">
<title>Begood 앱 컬렉션</title>
<link rel="stylesheet" href="./catalog.css">
<script type="module" src="./catalog.js"></script>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span> Begood</div>
    <div class="intro">
      <h1 id="title">앱 컬렉션</h1>
      <p id="subtitle">내 기기에서 사용할 수 있는 앱을 찾아보세요.</p>
    </div>
  </div>
</header>
<main class="wrap">
  <section aria-labelledby="catalog-title">
    <div class="toolbar">
      <h2 id="catalog-title">개발자의 다른 앱</h2>
      <div class="filters">
        <label><span id="region-label">국가</span><select id="country"></select></label>
        <label><span id="platform-label">플랫폼</span><select id="platform">
          <option value="all">전체</option><option value="ios">iOS</option><option value="android">Android</option>
        </select></label>
      </div>
    </div>
    <p id="status" role="status">앱 목록을 불러오는 중입니다.</p>
    <ul id="apps"></ul>
  </section>
</main>
<noscript>앱 목록을 보려면 JavaScript를 켜주세요. Enable JavaScript to view the catalog.</noscript>
</body>
</html>
